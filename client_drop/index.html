<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGLIS Secure Portal</title>
<link rel="manifest" href="./manifest.webmanifest">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
body{font-family:Inter,system-ui;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#141414;border:1px solid #222;border-radius:16px;padding:32px;max-width:480px;width:90%}
.btn{background:#fff;color:#000;padding:12px 18px;border-radius:10px;border:0;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
.small{color:#888;font-size:12px;margin-top:10px}
.file{background:#1e1e1e;padding:12px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
a{color:#fff}
</style>
</head>
<body>
<div class="card">
<h2 id="title">KINGLIS Secure Portal</h2>
<p id="status" class="small">Loading secure link...</p>
<button id="enableBtn" class="btn" style="display:none">Enable POP Notifications > Allow</button>
<div id="files"></div>
<p class="small">This link is private to you. Bookmark it. Files stay here to download anytime.<br>After you click Allow, you can close this window — you'll still get popups: "KINGLIS has sent you files"</p>
</div>

<script>
const params = new URLSearchParams(location.search);
const clientCode = params.get('c');
const titleEl = document.getElementById('title');
const statusEl = document.getElementById('status');
const filesEl = document.getElementById('files');
const btn = document.getElementById('enableBtn');

// PUT YOUR ONESIGNAL APP ID HERE - replace this line after you create app
const ONESIGNAL_APP_ID = 'REPLACE_WITH_YOUR_ONESIGNAL_APP_ID';

if(!clientCode){
  statusEl.textContent = 'Invalid link — missing ?c=CLIENT-... code';
} else {
  titleEl.textContent = 'KINGLIS • ' + clientCode;
  statusEl.textContent = 'Secure link active: ' + clientCode;
  loadManifest();
  initOneSignal();
}

async function loadManifest(){
  try{
    const res = await fetch(`./manifest_${clientCode}.json?t=${Date.now()}`);
    if(!res.ok) throw new Error('no manifest yet');
    const data = await res.json();
    filesEl.innerHTML = '';
    (data.files || []).reverse().forEach(f=>{
      const div = document.createElement('div');
      div.className='file';
      div.innerHTML = `<span>${f.name}</span><a href="${f.url}" download target="_blank">Download</a>`;
      filesEl.appendChild(div);
    });
    if((data.files||[]).length===0) filesEl.innerHTML='<p class="small">No files yet — KINGLIS will drop them here.</p>';
  }catch(e){
    filesEl.innerHTML='<p class="small">No files yet — waiting for KINGLIS...</p>';
  }
}

function initOneSignal(){
  if(ONESIGNAL_APP_ID.includes('REPLACE')){
    statusEl.textContent += ' | Add OneSignal App ID in index.html line 30';
    btn.style.display='none';
    return;
  }
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal){
    await OneSignal.init({
      appId: ONESIGNAL_APP_ID,
      notifyButton: { enable: true },
      allowLocalhostAsSecureOrigin: true,
    });
    // Tag this subscriber with client code so admin can target only him
    await OneSignal.login(clientCode);
    await OneSignal.User.addTag("client_code", clientCode);
    
    const permission = await OneSignal.Notifications.permission;
    if(!permission){
      btn.style.display='block';
      btn.onclick = async ()=>{
        await OneSignal.Notifications.requestPermission();
        statusEl.textContent = 'Background POP enabled for ' + clientCode + ' — you can now close this.';
        btn.style.display='none';
        // Test notification instantly
        new Notification("KINGLIS — Background POP enabled", {body:"You'll get KINGLIS has sent you files even when closed"});
      };
    } else {
      statusEl.textContent = 'POP enabled — you will get KINGLIS popups even when this tab is closed.';
    }
    // Listen for foreground notifications - show files
    OneSignal.Notifications.addEventListener('click', (event)=>{
      window.focus();
      loadManifest();
    });
  });
}

// Poll manifest every 45 sec as backup if push missed
setInterval(loadManifest, 45000);
</script>
</body>
</html>
