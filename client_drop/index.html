<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGLIS Secure Portal</title>
<link rel="manifest" href="./manifest.webmanifest">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
body{font-family:Inter,system-ui;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#141414;border:1px solid #222;border-radius:16px;padding:32px;max-width:480px;width:90%}
.btn{background:#fff;color:#000;padding:12px 18px;border-radius:10px;border:0;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
.small{color:#888;font-size:12px;margin-top:10px}
.file{background:#1e1e1e;padding:12px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
a{color:#fff}
</style>
</head>
<body>
<div class="card">
<h2 id="title">KINGLIS Secure Portal</h2>
<p id="status" class="small">Loading secure link...</p>
<button id="enableBtn" class="btn" style="display:none">Enable POP Notifications > Allow</button>
<div id="files"></div>
<p class="small">Bookmark this link. After Allow, you can close — you'll still get: "KINGLIS has sent you files"</p>
</div>
<script>
const params = new URLSearchParams(location.search);
const clientCode = params.get('c');
const titleEl = document.getElementById('title');
const statusEl = document.getElementById('status');
const filesEl = document.getElementById('files');
const btn = document.getElementById('enableBtn');
const ONESIGNAL_APP_ID = '052eb64e-0f35-4945-b4cb-171401e11c71';

if(!clientCode){
  statusEl.textContent = 'Invalid link — missing ?c=CLIENT-... code';
} else {
  titleEl.textContent = 'KINGLIS • ' + clientCode;
  statusEl.textContent = 'Secure link active: ' + clientCode;
  loadManifest();
  initOneSignal();
}

async function loadManifest(){
  try{
    const res = await fetch(`./manifest_${clientCode}.json?t=${Date.now()}`);
    if(!res.ok) throw new Error('no manifest');
    const data = await res.json();
    filesEl.innerHTML='';
    (data.files||[]).reverse().forEach(f=>{
      const div=document.createElement('div');
      div.className='file';
      div.innerHTML=`<span>${f.name}</span><a href="${f.url}" download target="_blank">Download</a>`;
      filesEl.appendChild(div);
    });
  }catch(e){ filesEl.innerHTML='<p class="small">No files yet — KINGLIS will drop them here.</p>'; }
}

function initOneSignal(){
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal){
    try{
      await OneSignal.init({ appId: ONESIGNAL_APP_ID, notifyButton: { enable: false }, allowLocalhostAsSecureOrigin: true });
      await OneSignal.login(clientCode);
      await OneSignal.User.addTag("client_code", clientCode);
      const permission = await OneSignal.Notifications.permission;
      if(!permission){
        btn.style.display='block';
        btn.onclick = async ()=>{
          await OneSignal.Notifications.requestPermission();
          statusEl.textContent='Background POP enabled for '+clientCode+' — you can now close this.';
          btn.style.display='none';
          try{ new Notification("KINGLIS — Background POP enabled", {body:"You'll get KINGLIS has sent you files even when closed"}); }catch(e){}
        };
      } else {
        statusEl.textContent='POP enabled — you will get KINGLIS popups even when tab is closed.';
      }
      OneSignal.Notifications.addEventListener('click', ()=>{ window.focus(); loadManifest(); });
    }catch(err){
      console.error(err);
      statusEl.textContent='OneSignal error: '+err.message;
      btn.style.display='block';
      btn.textContent='Enable POP (fallback)';
      btn.onclick=()=>Notification.requestPermission();
    }
  });
}
setInterval(loadManifest, 45000);
</script>
</body>
</html>
