<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGLIS Docs - True Push</title>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#141414;border:1px solid #222;border-radius:20px;padding:32px;max-width:460px;width:100%;text-align:center}
.logo{font-weight:900;letter-spacing:3px;font-size:22px}
.sub{color:#888;font-size:13px;margin:8px 0 20px}
.btn{width:100%;padding:14px;background:#fff;color:#000;border-radius:12px;border:0;font-weight:700;cursor:pointer}
.file{background:#1c1c1c;border:1px solid #2a2a2a;padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-top:12px;text-align:left;gap:12px}
.file-info{flex:1;min-width:0}
.file-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-date{font-size:11px;color:#666;margin-top:2px}
.file a{background:#fff;color:#000;padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;flex-shrink:0}
.status{font-size:12px;color:#555;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">KINGLIS</div>
  <div class="sub" id="sub">True push enabled</div>
  <div style="font-size:12px;color:#666;margin-bottom:12px">Allow notifications once — then you get POP even when you close this page and are in Word/Excel</div>
  <div id="files"></div>
  <div class="status" id="status">Connecting...</div>
</div>
<script>
const params = new URLSearchParams(location.search)
let clientCode = (params.get('c') || '').toUpperCase().trim()
document.getElementById('sub').innerText = clientCode ? 'Client: ' + clientCode : 'Add ?c=YOURCODE'

let seen=[]
try{ seen = JSON.parse(localStorage.getItem('seen_'+clientCode)||'[]') }catch{}

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  // PUT YOUR ONESIGNAL APP ID HERE
  const APP_ID = localStorage.getItem('os_app_id') || 'REPLACE_WITH_YOUR_ONESIGNAL_APP_ID'
  await OneSignal.init({
    appId: APP_ID,
    notifyButton: { enable: true },
  })
  if(clientCode){
    OneSignal.login(clientCode) // use client code as external ID
    OneSignal.User.addTag('client_code', clientCode)
    console.log('Tagged with client_code', clientCode)
  }
})

function cleanName(n){ return n.replace(/^\d+_/,'') }

async function check(){
  if(!clientCode) return
  try{
    let res = await fetch('./manifest_'+clientCode+'.json?t='+Date.now(), {cache:'no-store'})
    let rows
    if(res.ok) rows = await res.json()
    else{
      res = await fetch('./manifest.json?t='+Date.now(), {cache:'no-store'})
      const data = await res.json(); rows = data[clientCode]||[]
    }
    const container = document.getElementById('files')
    container.innerHTML=''
    document.getElementById('status').innerText = rows.length ? 'Connected - Push active' : 'No files yet'
    rows.slice().reverse().forEach(row=>{
      const div=document.createElement('div')
      div.className='file'
      div.innerHTML=`<div class="file-info"><div class="file-name">${cleanName(row.name)}</div><div class="file-date">${new Date(row.time).toLocaleString()}</div></div><a href="${row.url}" target="_blank" download>Download</a>`
      container.appendChild(div)
    })
    localStorage.setItem('seen_'+clientCode, JSON.stringify(rows.map(r=>r.url)))
  }catch(e){ document.getElementById('status').innerText='Waiting...' }
}
if(clientCode){ check(); setInterval(check, 15000) }
</script>
</body>
</html>
