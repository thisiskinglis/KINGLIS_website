<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGLIS Admin - True Push</title>
<style>
body{font-family:Inter,system-ui;background:#0a0a0a;color:#fff;padding:24px}
.card{background:#141414;border:1px solid #222;border-radius:16px;padding:24px;max-width:720px;margin:auto;margin-bottom:20px}
input,button{padding:12px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;width:100%;margin-top:8px;box-sizing:border-box}
.btn{background:#fff;color:#000;font-weight:700;cursor:pointer;border:0}
.btn-push{background:#ff3b30;color:#fff;font-weight:700;cursor:pointer;border:0;margin-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small{color:#888;font-size:12px}
</style>
</head>
<body>
<div class="card">
<h2>KINGLIS Admin — SEND + TRUE POP</h2>
<p class="small">Drop files > SEND — client gets OS popup even if Chrome closed: "KINGLIS has sent you files"</p>
<label>Client Code (e.g. CLIENT-SMITH-A7K9P2)</label>
<input id="clientCode" placeholder="CLIENT-...">
<label>Drop Files</label>
<input type="file" id="fileInput" multiple>
<div id="fileList" class="small"></div>
<button id="sendBtn" class="btn">SEND Files</button>
<button id="sendPushBtn" class="btn-push">SEND + Push POP "KINGLIS has sent you files"</button>
<p id="log" class="small"></p>
</div>

<div class="card">
<h3>Settings (saved locally)</h3>
<div class="row">
<div><label>GitHub PAT (for upload)</label><input id="ghToken" placeholder="ghp_..."></div>
<div><label>GitHub Repo (owner/repo)</label><input id="ghRepo" placeholder="yourname/thisiskinglis.com"></div>
</div>
<div class="row">
<div><label>OneSignal App ID</label><input id="osAppId" placeholder="xxxxxxxx-xxxx..."></div>
<div><label>OneSignal REST API Key</label><input id="osRest" placeholder="OS REST Key"></div>
</div>
<button onclick="saveKeys()" class="btn">Save Keys</button>
<p class="small">Keys stay in your browser localStorage only. Never committed.</p>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const log = document.getElementById('log');
let files = [];
fileInput.onchange = e=>{ files = [...e.target.files]; fileList.textContent = files.map(f=>f.name).join(', '); };

function saveKeys(){
  localStorage.setItem('gh_token', document.getElementById('ghToken').value);
  localStorage.setItem('gh_repo', document.getElementById('ghRepo').value);
  localStorage.setItem('os_app_id', document.getElementById('osAppId').value);
  localStorage.setItem('os_rest', document.getElementById('osRest').value);
  log.textContent='Saved!';
}
window.onload=()=>{
  document.getElementById('ghToken').value=localStorage.getItem('gh_token')||'';
  document.getElementById('ghRepo').value=localStorage.getItem('gh_repo')||'';
  document.getElementById('osAppId').value=localStorage.getItem('os_app_id')||'';
  document.getElementById('osRest').value=localStorage.getItem('os_rest')||'';
};

async function uploadToGitHub(clientCode, file){
  const token = localStorage.getItem('gh_token');
  const repo = localStorage.getItem('gh_repo');
  if(!token || !repo) throw new Error('Set GitHub PAT + repo in settings');
  const path = `client_drop/files/${clientCode}/${Date.now()}_${file.name}`;
  const content = await file.arrayBuffer().then(b=>btoa(String.fromCharCode(...new Uint8Array(b))));
  const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{
    method:'PUT',
    headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
    body: JSON.stringify({message:`Upload ${file.name} for ${clientCode}`, content, branch:'main'})
  });
  if(!res.ok){ const t=await res.text(); throw new Error('GitHub upload failed: '+t); }
  const json = await res.json();
  return {name:file.name, url: json.content.download_url, path};
}

async function getAndUpdateManifest(clientCode, newFiles){
  const token = localStorage.getItem('gh_token');
  const repo = localStorage.getItem('gh_repo');
  const manifestPath = `client_drop/manifest_${clientCode}.json`;
  let existing = {client_code:clientCode, files:[]};
  let sha=null;
  try{
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${manifestPath}`,{
      headers:{'Authorization':`Bearer ${token}`}
    });
    if(r.ok){ const j=await r.json(); sha=j.sha; existing=JSON.parse(atob(j.content)); }
  }catch(e){}
  existing.files = [...(existing.files||[]), ...newFiles];
  existing.updated_at = new Date().toISOString();
  const content = btoa(JSON.stringify(existing, null, 2));
  const res = await fetch(`https://api.github.com/repos/${repo}/contents/${manifestPath}`,{
    method:'PUT',
    headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
    body: JSON.stringify({message:`Update manifest for ${clientCode}`, content, sha, branch:'main'})
  });
  if(!res.ok) throw new Error('Manifest update failed');
}

async function sendOneSignalPush(clientCode, fileNames){
  const appId = localStorage.getItem('os_app_id');
  const rest = localStorage.getItem('os_rest');
  if(!appId || !rest) throw new Error('Set OneSignal keys');
  const body = {
    app_id: appId,
    filters: [{field:'tag', key:'client_code', relation:'=', value: clientCode}],
    headings: {en: 'KINGLIS has sent you files'},
    contents: {en: fileNames.join(', ') + ' — Click to download'},
    url: `https://thisiskinglis.com/client_drop/?c=${clientCode}`,
    chrome_web_icon: 'https://thisiskinglis.com/favicon.ico',
    isChromeWeb: true
  };
  const res = await fetch('https://api.onesignal.com/notifications',{
    method:'POST',
    headers:{'Authorization':`Basic ${rest}`,'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const j = await res.json();
  if(!res.ok) throw new Error('OneSignal failed: '+JSON.stringify(j));
  return j;
}

async function handleSend(withPush){
  const clientCode = document.getElementById('clientCode').value.trim();
  if(!clientCode) return alert('Enter client code');
  if(files.length===0) return alert('Select files');
  log.textContent='Uploading '+files.length+' files...';
  try{
    const uploaded=[];
    for(const f of files){ log.textContent=`Uploading ${f.name}...`; const u=await uploadToGitHub(clientCode,f); uploaded.push(u); }
    await getAndUpdateManifest(clientCode, uploaded);
    log.textContent='Files uploaded to GitHub. '+ (withPush ? 'Sending PUSH...' : 'Done (no push)');
    if(withPush){
      const pushRes = await sendOneSignalPush(clientCode, files.map(f=>f.name));
      log.textContent=`DONE! Files sent + PUSH sent to ${clientCode}. OneSignal ID: ${pushRes.id} — Client will get OS popup within 15 sec even if Chrome closed.`;
    } else {
      log.textContent='DONE! Files sent. Client sees them when they refresh link.';
    }
  }catch(e){ log.textContent='ERROR: '+e.message; console.error(e); }
}

document.getElementById('sendBtn').onclick=()=>handleSend(false);
document.getElementById('sendPushBtn').onclick=()=>handleSend(true);
</script>
</body>
</html>
